<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#0a1222;color:white;font-family:sans-serif;display:flex;justify-content:center;padding:15px;margin:0}.card{background:#162032;padding:22px;border-radius:20px;width:100%}.header{text-align:center;margin-bottom:20px;font-size:26px;font-weight:bold}label{color:#a0aec0;font-size:14px;margin-top:14px;display:block}input{width:100%;background:#0f1a2e;border:1px solid #2d3a52;border-radius:12px;padding:14px;color:white;margin-top:6px;box-sizing:border-box}.btn{width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin-top:14px}.btn-primary{background:#7eb8ff}.btn-secondary{background:#2d3a52;color:white;border:1px solid #3d4f6f}#status{text-align:center;color:#7eb8ff;margin-bottom:10px;min-height:18px}</style></head>
<body>
<div style="width:100%;max-width:380px;">
<div class="header">🦅 FalconX Pay</div>
<div class="card"><h2>Send FLX</h2><div id="status"></div><label>Recipient Address</label><input id="recipient" placeholder="0x..."><label>Amount</label><input id="amount" type="number" placeholder="0.0"><button class="btn btn-primary" onclick="sendFLX()">Send FLX</button><button class="btn btn-secondary" id="connectBtn" onclick="connectWallet()">Connect Wallet</button></div>
<div style="margin-top:20px;padding:20px;background:#162032;border-radius:20px;">
<h2 style="text-align:center;">🗺️ Roadmap</h2>
<div style="border-left:3px solid #7eb8ff;padding-left:15px;margin-top:20px;"><h3 style="color:#7eb8ff;">Phase 1: Foundation - DONE ✅</h3><p style="color:#a0aec0;font-size:13px;">Website, Logo, Contract Created</p></div>
<div style="border-left:3px solid #7eb8ff;padding-left:15px;margin-top:20px;"><h3 style="color:#7eb8ff;">Phase 2: Launch - NOW 🔄</h3><p style="color:#a0aec0;font-size:13px;">Deploy, BscScan Verify, Community</p></div>
<div style="border-left:3px solid #555;padding-left:15px;margin-top:20px;"><h3>Phase 3: FalconX Pay App</h3><p style="color:#a0aec0;font-size:13px;">Real Wallet Connect, QR Send</p></div>
<div style="border-left:3px solid #555;padding-left:15px;margin-top:20px;"><h3>Phase 4: Listing</h3><p style="color:#a0aec0;font-size:13px;">PancakeSwap, CMC, Marketing</p></div>
</div></div>
<script>let userAccount=null;async function connectWallet(){const s=document.getElementById("status");const b=document.getElementById("connectBtn");if(typeof window.ethereum==='undefined'){s.innerText="❌ MetaMask ba a saka ba";return}try{b.innerText="Connecting...";const a=await window.ethereum.request({method:'eth_requestAccounts'});userAccount=a[0];s.innerText="✅ "+userAccount.substring(0,6)+"..."+userAccount.substring(38);b.innerText="Connected ✓"}catch(e){s.innerText="❌ An ki";b.innerText="Connect Wallet"}}function sendFLX(){const r=document.getElementById("recipient").value;const am=document.getElementById("amount").value;const s=document.getElementById("status");if(!userAccount){s.innerText="⚠️ Hada Wallet da farko!";return}if(r.length<42){s.innerText="⚠️ Address ba daidai ba!";return}s.innerText="⏳ Ana tura "+am+" FLX..."}</script></body></html>
